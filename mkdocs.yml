site_name: Digital Garden
site_description: Personal wiki and synthesised notes from books, articles, and AI research sessions.
site_url: https://yadwinderverma.github.io/digital-garden/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Books:
      - books/index.md
      - Sapiens (Yuval Noah Harari):
          - Overview & Core Thesis: books/sapiens/index.md
          - "Part 1: The Cognitive Revolution": books/sapiens/part-1-cognitive-revolution.md
          - "Part 2: The Agricultural Revolution": books/sapiens/part-2-agricultural-revolution.md
  - Topics:
      - topics/index.md
      - Systems & Coordination:
          - Shared Myths & Coordination: topics/human-coordination-and-myths.md
      - Technology & Data:
          - Information Systems Evolution: topics/information-systems-evolution.md
          - Synthesising AI Research: topics/ai-knowledge-management.md
  - Tags: tags.md
