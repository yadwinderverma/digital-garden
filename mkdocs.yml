site_name: Listening Log
site_description: Key themes, quotes, and anecdotes from the audiobooks I listen to.
site_url: https://yadwinderverma.github.io/listening-log/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tasklist:
      custom_checkbox: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Books:
      - books/index.md
      - Sapiens (Yuval Noah Harari):
          - Overview & Core Thesis: books/sapiens/index.md
          - "Part 1: The Cognitive Revolution": books/sapiens/part-1-cognitive-revolution.md
          - "Part 2: The Agricultural Revolution": books/sapiens/part-2-agricultural-revolution.md
          - "Part 3: The Unification of Humankind": books/sapiens/part-3-unification-of-humankind.md
          - "Part 4: The Scientific Revolution": books/sapiens/part-4-scientific-revolution.md
